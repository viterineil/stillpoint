name: Feature proposal
description: Propose a scoped capability or design change
title: "proposal: "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Recovery problem
      description: What failure or restoration need is not covered?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Failure and cleanup behavior
      description: Explain partial failure, cancellation, and restore implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
